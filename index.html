<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting...</title>
<style>
  body {
    background-color: #111;
    color: #bbb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  
  /* メインのボタン */
  .manual-button {
    display: inline-block;
    background-color: #7B1FA2; /* Obsidian Purple */
    color: white;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    margin-top: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    border: 1px solid #9c27b0;
  }
  .manual-button:active {
    transform: scale(0.95);
    background-color: #6A1B9A;
  }

  h1 { font-size: 1.2rem; font-weight: normal; color: #fff; margin-bottom: 0.5rem; }
  p.debug-url {
    font-family: monospace;
    font-size: 0.8rem;
    color: #555;
    word-break: break-all;
    margin-top: 20px;
    max-width: 90%;
  }

  /* ヘルプ */
  .help-container {
    text-align: left;
    display: inline-block;
    background: #222;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
    max-width: 600px;
  }
  .help-container h2 { font-size: 1rem; color: #eee; margin-top: 0; }
  .help-container code { background: #333; padding: 2px 4px; border-radius: 4px; }
</style>
<script>
  function launch() {
    const params = new URLSearchParams(window.location.search);
    const statusDiv = document.getElementById('status');
    const actionArea = document.getElementById('action-area');
    
    // パラメータ取得
    const shortcut = params.get('name');
    const vault = params.get('vault');
    const file = params.get('file');
    const uid = params.get('uid');
    const filepath = params.get('filepath');
    const command = params.get('command');
    const heading = params.get('heading');
    const block = params.get('block');
    const upnote = params.get('upnote');
    const filterId = params.get('filter');
    const notebookId = params.get('notebook');

    let uri = '';
    let msg = '';

    // URI生成ロジック
    if (shortcut) {
      uri = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcut);
      msg = "🚀 " + shortcut;
    }
    // Obsidian (Advanced URI & Standard)
    else if (uid || command || filepath || file || vault) {
      // 優先: Advanced URI (scheme: obsidian://adv-uri)
      if (uid || command || filepath || heading || block) {
        uri = 'obsidian://adv-uri'; // あなたの実績に合わせて adv-uri を採用
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        
        if (uid) {
           queries.push('uid=' + encodeURIComponent(uid));
           msg = "💎 Opening Note (UID)";
        } else if (filepath) {
           queries.push('filepath=' + encodeURIComponent(filepath));
           msg = "💎 Opening Note (Path)";
        } else if (command) {
           if (!msg) msg = "💎 Running Command";
        } else {
           msg = "💎 Opening Vault";
        }

        if (command) queries.push('commandid=' + encodeURIComponent(command));
        if (heading) queries.push('heading=' + encodeURIComponent(heading));
        if (block)   queries.push('block=' + encodeURIComponent(block));
        
        if (queries.length > 0) uri += '?' + queries.join('&');
      }
      // フォールバック: Standard URI
      else {
        uri = 'obsidian://open';
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        if (file)  queries.push('file=' + encodeURIComponent(file));
        if (queries.length > 0) uri += '?' + queries.join('&');
        msg = "💎 Opening Obsidian";
      }
    }
    // UpNote
    else if (upnote || filterId || notebookId) {
       // ... (UpNoteロジック省略: 前と同じ)
       if (upnote === 'new') uri = 'upnote://x-callback-url/note/new';
       else uri = 'upnote://';
       msg = "🐘 UpNote";
    }

    // 実行
    if (uri) {
      // 1. ステータス表示
      statusDiv.innerHTML = `<h1>${msg}...</h1>`;
      
      // 2. 手動ボタンの設置 (自動で飛ばない場合用)
      actionArea.innerHTML = `
        <a href="${uri}" class="manual-button">ここをクリックして開く</a>
        <p class="debug-url">Target: ${uri}</p>
      `;

      // 3. 自動リダイレクト試行
      console.log("Redirecting to:", uri);
      window.location.href = uri;

      // 自動クローズはあえて無効化（手動ボタンが必要な場合があるため）
      // setTimeout(() => { window.close(); }, 5000); 
    } else {
      showHelp(actionArea);
    }
  }

  function showHelp(container) {
    container.innerHTML = `<div class="help-container"><h2>パラメータが必要です</h2><p>例: ?vault=MyVault&uid=...</div>`;
  }

  window.onload = launch;
</script>
</head>
<body>
  <div id="status"><h1>Loading...</h1></div>
  <div id="action-area"></div>
</body>
</html>
