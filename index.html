<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge to Obsidian</title>
<style>
  body {
    background-color: #111;
    color: #bbb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  
  /* ボタンのスタイル */
  #manual-btn {
    display: none; /* 初期状態は非表示 */
    background-color: #7B1FA2;
    color: white;
    padding: 18px 40px;
    font-size: 1.3rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 50px; /* 丸みを帯びさせる */
    margin-top: 20px;
    box-shadow: 0 4px 15px rgba(123, 31, 162, 0.4);
    border: 2px solid #9c27b0;
    transition: transform 0.1s, background-color 0.2s;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #manual-btn:active {
    transform: scale(0.95);
    background-color: #6A1B9A;
  }
  
  h1 { font-size: 1.2rem; font-weight: normal; color: #fff; margin-bottom: 0.5rem; }
  
  #debug-url {
    font-family: monospace;
    font-size: 0.7rem;
    color: #444;
    margin-top: 30px;
    word-break: break-all;
    max-width: 90%;
  }
</style>
<script>
  function launch() {
    const params = new URLSearchParams(window.location.search);
    const statusText = document.getElementById('status-text');
    const manualBtn = document.getElementById('manual-btn');
    const debugText = document.getElementById('debug-url');
    
    // パラメータ取得
    const shortcut = params.get('name');
    const vault = params.get('vault');
    const file = params.get('file');
    const uid = params.get('uid');
    const filepath = params.get('filepath');
    const command = params.get('command');
    const heading = params.get('heading');
    const block = params.get('block');
    const upnote = params.get('upnote');

    let uri = '';
    let label = '';

    // --- URI生成ロジック ---
    if (shortcut) {
      uri = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcut);
      label = "ショートカットを起動";
    }
    else if (uid || command || filepath || file || vault) {
      if (uid || command || filepath || heading || block) {
        uri = 'obsidian://adv-uri'; 
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        
        if (uid) {
           queries.push('uid=' + encodeURIComponent(uid));
           label = "ノートを開く (UID)";
        } else if (filepath) {
           queries.push('filepath=' + encodeURIComponent(filepath));
           label = "ノートを開く (Path)";
        } else if (command) {
           label = "コマンドを実行";
        } else {
           label = "Obsidianを開く";
        }

        if (command) queries.push('commandid=' + encodeURIComponent(command));
        if (heading) queries.push('heading=' + encodeURIComponent(heading));
        if (block)   queries.push('block=' + encodeURIComponent(block));
        
        if (queries.length > 0) uri += '?' + queries.join('&');
      }
      else {
        uri = 'obsidian://open';
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        if (file)  queries.push('file=' + encodeURIComponent(file));
        if (queries.length > 0) uri += '?' + queries.join('&');
        label = "Obsidianを開く";
      }
    }
    else if (upnote) {
       uri = (upnote === 'new') ? 'upnote://x-callback-url/note/new' : 'upnote://';
       label = "UpNoteを開く";
    }

    // --- 実行準備 ---
    if (uri) {
      // 1. テキスト設定
      statusText.textContent = "準備完了";
      debugText.textContent = uri; 
      
      // 2. ボタン設定
      manualBtn.textContent = label;
      manualBtn.style.display = 'inline-block';
      
      // 3. クリックイベント（自動遷移はしない）
      manualBtn.onclick = function(e) {
        e.preventDefault(); // デフォルトのリンク動作を防止し、JSで制御
        
        // アプリ起動
        window.location.href = uri;
        
        // UIフィードバック
        statusText.textContent = "起動しました";
        manualBtn.textContent = "Done ✓";
        manualBtn.style.backgroundColor = "#333";
        manualBtn.style.borderColor = "#555";
        
        // 1秒後にタブを閉じる試み
        setTimeout(() => {
          window.close();
        }, 1000);
      };
      
    } else {
      statusText.textContent = "リンクが無効です";
      debugText.innerHTML = "パラメータ(?vault=...等)が必要です";
    }
  }

  window.onload = launch;
</script>
</head>
<body>
  <h1 id="status-text">Loading...</h1>
  
  <a id="manual-btn" href="#">Open</a>
  
  <p id="debug-url"></p>
</body>
</html>
