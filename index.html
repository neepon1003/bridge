<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting...</title>
<style>
  body {
    background-color: #111;
    color: #bbb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    text-align: center;
  }
  
  /* ボタンのスタイル */
  #manual-btn {
    display: none; /* 初期状態は非表示 */
    background-color: #7B1FA2;
    color: white;
    padding: 15px 30px;
    font-size: 1.2rem;
    font-weight: bold;
    text-decoration: none;
    border-radius: 8px;
    margin-top: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    border: 1px solid #9c27b0;
  }
  
  h1 { font-size: 1.2rem; font-weight: normal; color: #fff; margin-bottom: 0.5rem; }
  
  #debug-url {
    font-family: monospace;
    font-size: 0.7rem;
    color: #444;
    margin-top: 30px;
    word-break: break-all;
    max-width: 90%;
  }
</style>
<script>
  function launch() {
    const params = new URLSearchParams(window.location.search);
    const statusText = document.getElementById('status-text');
    const manualBtn = document.getElementById('manual-btn');
    const debugText = document.getElementById('debug-url');
    
    // パラメータ取得
    const shortcut = params.get('name');
    const vault = params.get('vault');
    const file = params.get('file');
    const uid = params.get('uid');
    const filepath = params.get('filepath');
    const command = params.get('command');
    const heading = params.get('heading');
    const block = params.get('block');
    const upnote = params.get('upnote');

    let uri = '';
    let msg = '';

    // --- URI生成ロジック ---
    if (shortcut) {
      uri = 'shortcuts://run-shortcut?name=' + encodeURIComponent(shortcut);
      msg = "🚀 Shortcut";
    }
    // Obsidian
    else if (uid || command || filepath || file || vault) {
      // Advanced URI (scheme: obsidian://adv-uri)
      if (uid || command || filepath || heading || block) {
        uri = 'obsidian://adv-uri'; 
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        
        if (uid) {
           queries.push('uid=' + encodeURIComponent(uid));
           msg = "💎 Opening Note (UID)";
        } else if (filepath) {
           queries.push('filepath=' + encodeURIComponent(filepath));
           msg = "💎 Opening Note (Path)";
        } else if (command) {
           if (!msg) msg = "💎 Command";
        } else {
           msg = "💎 Obsidian";
        }

        if (command) queries.push('commandid=' + encodeURIComponent(command));
        if (heading) queries.push('heading=' + encodeURIComponent(heading));
        if (block)   queries.push('block=' + encodeURIComponent(block));
        
        if (queries.length > 0) uri += '?' + queries.join('&');
      }
      // Standard URI
      else {
        uri = 'obsidian://open';
        let queries = [];
        if (vault) queries.push('vault=' + encodeURIComponent(vault));
        if (file)  queries.push('file=' + encodeURIComponent(file));
        if (queries.length > 0) uri += '?' + queries.join('&');
        msg = "💎 Obsidian";
      }
    }
    // UpNote
    else if (upnote) {
       uri = (upnote === 'new') ? 'upnote://x-callback-url/note/new' : 'upnote://';
       msg = "🐘 UpNote";
    }

    // --- 実行 ---
    if (uri) {
      // 1. 画面更新 (まず表示させる)
      statusText.textContent = msg + "...";
      debugText.textContent = uri; // デバッグ用にURLを表示
      
      manualBtn.href = uri;
      manualBtn.style.display = 'inline-block'; // ボタンを表示

      // 2. 遅延リダイレクト (0.5秒待つ)
      console.log("Redirecting in 500ms to:", uri);
      setTimeout(() => {
        window.location.href = uri;
      }, 500);
      
    } else {
      statusText.textContent = "パラメータエラー";
      debugText.innerHTML = "使用例: ?vault=Name&uid=...";
    }
  }

  window.onload = launch;
</script>
</head>
<body>
  <h1 id="status-text">Loading...</h1>
  
  <a id="manual-btn" href="#">ここをクリックして開く</a>
  
  <p id="debug-url"></p>
</body>
</html>
